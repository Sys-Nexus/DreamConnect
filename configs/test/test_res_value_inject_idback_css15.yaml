model:
  base_learning_rate: 1.0e-04
  weight_decay: 0.01
  target: ldm.models.diffusion.fmri_versatile_dualstream.DualLDM
  params:
    use_styleclip_loss: False
    use_fmri_clip: True
    fp16: True
    deepspeed: 'deepspeed_1'
    only_mid_control: False
    control_key: 'fmri'
    use_resnet_inject: True
    # put your ckpt path here.
    ctx_adaptor_ckpt_path: /data/yashengsun/Proj/MMEdit/MindSculpt/logs/train_res_inject_idback_train_res_inject_idback_2024-04-22/checkpoints/ckpt_epoch_50/mp_rank_00_model_states.pt
    ckpt_path: /data/yashengsun/Proj/MMEdit/MindSculpt/stable_diffusion/models/ldm/stable-diffusion-v1/v1-5-pruned-emaonly-adaption-task-humanalign.ckpt
    # ckpt_path: stable_diffusion/models/ldm/stable-diffusion-v1/MagicBrush-epoch-52-step-4999.ckpt
    # ctx_adaptor_ckpt_path: /data/yashengsun/Proj/MMEdit/fMRIInstructDiffusion/logs/train_conv_adaptor_train_conv_adaptor_2024-04-07/checkpoints/ckpt_epoch_60/mp_rank_00_model_states.pt
    linear_start: 0.00085
    linear_end: 0.0120
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: edited
    cond_stage_key: fmri_edit
    fmri_cond_stage_key: fmri_edit
    image_size: 32
    channels: 4
    cond_stage_trainable: false   # Note: different from the one we trained before
    cond_stage_trainable_fmri: false   # Note: different from the one we trained before
    unet_stage_trainable: true  # Note: different from the one we trained before
    control_unet_stage_trainable: true  # Note: different from the one we trained before
    conditioning_key: fmri_noisy_concat
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    unet_lr_ratio: 1e-9
    coarse_spatial_steps: 15
    is_save_x0: true
    is_save_intermediate: false

    scheduler_config: # 10000 warmup steps
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps: [ 0 ]
        cycle_lengths: [ 10000000000000 ] # incredibly large number to prevent corner cases
        f_start: [ 1.e-6 ]
        f_max: [ 1. ]
        f_min: [ 1. ]

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity
    
    pretrained_control_unet_path: '/data/yashengsun/Proj/MMEdit/MindSculpt/third_party/versatile_diffusion/pretrained/vd-four-flow-v1-0-fp16-deprecated.pth'
    control_stage_config:
      target: ldm.models.diffusion.fmri_versatile_dualstream.PreVersatileNetAdaptor
      params:
        train_feat_adaptor: True
        unet_image_cfg:
          type: openai_unet_2d
          name: openai_unet_2d
          args:
            input_channels: 4
            model_channels: 320
            output_channels: 4
            num_noattn_blocks: [ 2, 2, 2, 2 ]
            channel_mult: [ 1, 2, 4, 4 ]
            with_attn: [true, true, true, false]
            num_heads: 8
            context_dim: 768
            use_checkpoint: True

        unet_text_cfg:
          type: openai_unet_0dmd
          name: openai_unet_0dmd
          args:
            input_channels: 768
            model_channels: 320
            output_channels: 768
            num_noattn_blocks: [ 2, 2, 2, 2 ]
            channel_mult: [ 1, 2, 4, 4 ]
            second_dim: [ 4, 4, 4, 4 ]
            with_attn: [true, true, true, false]
            num_heads: 8
            context_dim: 768
            use_checkpoint: True

    unet_config:
      target: ldm.models.diffusion.fmri_versatile_dualstream.ZeroConvControlledUnetModel
      params:
        image_size: 32 # unused
        in_channels: 8
        out_channels: 4
        model_channels: 320
        attention_resolutions: [ 4, 2, 1 ]
        num_res_blocks: 2
        channel_mult: [ 1, 2, 4, 4 ]
        num_heads: 8
        use_spatial_transformer: True
        transformer_depth: 1
        context_dim: 768
        use_checkpoint: True
        legacy: False
        force_type_convert: True
        train_feat_adaptor: True
        isTest: True

    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenCLIPEmbedder

    fmri_lowlevel_path: train_logs/autoencoder_subj01_4x_locont_no_reconst/epoch120.pth
    fmri_lowlevel_config:
      target: ldm.modules.encoders.fmri_nips23.Voxel2StableDiffusionModel
      params: 
        in_dim: 15724

    clip_cfg:
      symbol: clip
      args: {}
      name: clip_frozen
      type: clip_frozen

data:
  target: main.DataModuleFromConfig
  params:
    # batch_size: 4
    batch_size: 1
    num_workers: 4
    train:
      target: third_party.StableDiffusionReconstruction.codes.utils.nsd_creater.NIPS23NSDDataset
      params:
        nsd_root: '/data/yashengsun/Proj/MMEdit/StableDiffusionReconstruction/nsd'
        resolution: 320
        split: 'train'
        is_reconstruct_mode: False
        url: 'nsd_data_dir/train_subj01_{0..17}.tar'
        reconstruct_prob: 0.0

    validation:
      target: third_party.StableDiffusionReconstruction.codes.utils.nsd_creater.NIPS23NSDDataset
      params:
        nsd_root: '/data/yashengsun/Proj/MMEdit/StableDiffusionReconstruction/nsd'
        resolution: 320
        split: 'test'
        is_reconstruct_mode: False
        url: 'nsd_data_dir/test_subj01_{0..1}.tar'
        reconstruct_prob: 0.0
        use_first_instruct: True

trainer:
  initial_scale: 13
  max_epochs: 200
  save_freq: 5
  accumulate_grad_batches: 1
  clip_grad: 0.0
  optimizer: adamw
